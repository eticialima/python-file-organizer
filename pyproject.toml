[project]
name = "python-file-organizer"
version = "0.1.0"
description = "File organizer automation using watchdog and pathlib"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7",
    "watchdog>=4.0",
]

[project.scripts]
file-organizer = "file_organizer.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
